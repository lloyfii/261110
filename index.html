<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SKY STRIKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  SKY STRIKER — 다이나믹 비행 슈팅 게임 (단일 파일, 외부 라이브러리 없음)
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, vignette = null;
const FONT = "'Orbitron','Black Han Sans','Malgun Gothic',sans-serif";
const KFONT = "'Black Han Sans','Malgun Gothic',sans-serif";

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR | 0; cv.height = H * DPR | 0;
  vignette = document.createElement('canvas');
  vignette.width = W; vignette.height = H;
  const g = vignette.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.6);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,10,0.65)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const angDiff = (a, b) => ((b - a) % TAU + TAU * 1.5) % TAU - Math.PI;
const fmt = n => Math.round(n).toLocaleString('en-US');
const C = {
  cyan: '80,220,255', pink: '255,70,160', orange: '255,150,40', yellow: '255,230,110',
  red: '255,50,70', white: '255,255,255', green: '90,255,150', purple: '180,100,255'
};

// ---------- pre-rendered sprites ----------
const glowCache = {};
function glowSprite(c) {
  let s = glowCache[c]; if (s) return s;
  s = document.createElement('canvas'); s.width = s.height = 128;
  const g = s.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${c},1)`); gr.addColorStop(0.22, `rgba(${c},0.65)`);
  gr.addColorStop(0.55, `rgba(${c},0.16)`); gr.addColorStop(1, `rgba(${c},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  return glowCache[c] = s;
}
function glow(x, y, r, c, a = 1) {
  if (a <= 0 || r <= 0) return;
  ctx.globalAlpha = Math.min(1, a);
  ctx.drawImage(glowSprite(c), x - r, y - r, r * 2, r * 2);
}
const smokeSprite = (() => {
  const s = document.createElement('canvas'); s.width = s.height = 64;
  const g = s.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(60,60,75,0.9)'); gr.addColorStop(0.6, 'rgba(40,40,55,0.4)'); gr.addColorStop(1, 'rgba(30,30,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return s;
})();
const cloudSprites = [];
for (let i = 0; i < 4; i++) {
  const s = document.createElement('canvas'); s.width = s.height = 256;
  const g = s.getContext('2d');
  for (let j = 0; j < 16; j++) {
    const x = rand(60, 196), y = rand(70, 186), r = rand(25, 62);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  cloudSprites.push(s);
}
// seamless city ground tile
const groundTile = (() => {
  const S = 512, s = document.createElement('canvas'); s.width = s.height = S;
  const g = s.getContext('2d');
  const wrap = (x, y, fn) => { for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) fn(x + dx, y + dy); };
  for (let i = 0; i < 80; i++) {
    const w = rand(18, 90), h = rand(18, 90), x = rand(0, S), y = rand(0, S);
    const col = `rgba(${rand(20, 45) | 0},${rand(40, 75) | 0},${rand(80, 130) | 0},0.35)`;
    wrap(x, y, (gx, gy) => {
      g.fillStyle = col; g.fillRect(gx, gy, w, h);
      g.strokeStyle = 'rgba(120,180,255,0.13)'; g.lineWidth = 1; g.strokeRect(gx + .5, gy + .5, w, h);
    });
  }
  g.strokeStyle = 'rgba(150,200,255,0.10)'; g.lineWidth = 7;
  for (let k = 0; k <= S; k += 128) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k, S); g.stroke();
    g.beginPath(); g.moveTo(0, k); g.lineTo(S, k); g.stroke();
  }
  g.strokeStyle = 'rgba(255,220,120,0.18)'; g.lineWidth = 1; g.setLineDash([8, 10]);
  for (let k = 0; k <= S; k += 128) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k, S); g.stroke();
    g.beginPath(); g.moveTo(0, k); g.lineTo(S, k); g.stroke();
  }
  g.setLineDash([]);
  const lc = ['255,200,120', '120,200,255', '255,120,180', '255,255,220'];
  for (let i = 0; i < 420; i++) {
    let x = rand(0, S), y = rand(0, S);
    if (Math.random() < 0.4) { if (Math.random() < 0.5) x = Math.round(x / 128) * 128 + rand(-5, 5); else y = Math.round(y / 128) * 128 + rand(-5, 5); }
    const r = rand(1.5, 4.5), c = lc[Math.random() * lc.length | 0];
    wrap(x, y, (gx, gy) => {
      const gr = g.createRadialGradient(gx, gy, 0, gx, gy, r * 2);
      gr.addColorStop(0, `rgba(${c},0.9)`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(gx - r * 2, gy - r * 2, r * 4, r * 4);
    });
  }
  return s;
})();

// ---------- audio (synthesized) ----------
let AC = null, master = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.4; master.connect(AC.destination);
    const len = AC.sampleRate; noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, f0, f1, ft = 'lowpass') {
  if (!AC || muted) return;
  const t = AC.currentTime, src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = noiseBuf; src.loop = true; f.type = ft;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + dur + 0.05);
}
function sfx(k) {
  switch (k) {
    case 'shoot': tone('square', 900, 280, 0.05, 0.022); break;
    case 'hit': tone('triangle', 320, 120, 0.05, 0.05); break;
    case 'boom': noise(0.5, 0.5, 2200, 60); tone('sine', 140, 40, 0.3, 0.25); break;
    case 'bigboom': noise(1.6, 0.9, 1400, 40); tone('sine', 90, 25, 1.2, 0.5); break;
    case 'pickup': tone('sine', 600, 1200, 0.12, 0.15); tone('sine', 900, 1800, 0.15, 0.1, 0.07); break;
    case 'hurt': tone('sawtooth', 220, 50, 0.35, 0.22); noise(0.3, 0.3, 3000, 200); break;
    case 'roll': noise(0.35, 0.3, 300, 2400, 'bandpass'); break;
    case 'warn': for (let i = 0; i < 6; i++) tone('square', i % 2 ? 660 : 440, i % 2 ? 660 : 440, 0.16, 0.07, i * 0.2); break;
    case 'charge': tone('sine', 200, 1100, 1.0, 0.07); break;
    case 'laser': tone('sawtooth', 110, 70, 1.4, 0.12); noise(1.2, 0.25, 900, 300, 'bandpass'); break;
    case 'missile': noise(0.15, 0.08, 1500, 600, 'bandpass'); break;
    case 'graze': tone('sine', 1800, 2400, 0.04, 0.03); break;
  }
}

// ---------- input ----------
const keys = {};
const pointer = { active: false, x: 0, y: 0, type: 'mouse' };
const touches = new Map(); let lastTap = 0;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  initAudio(); touches.set(e.pointerId, 1);
  pointer.type = e.pointerType; pointer.x = e.clientX; pointer.y = e.clientY;
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (overT > 1.5) startGame(); return; }
  if (paused) { paused = false; return; }
  if (e.button === 2 || touches.size >= 2) { useBomb(); return; }
  const now = performance.now(); if (now - lastTap < 280) startRoll(); lastTap = now;
  pointer.active = true;
});
cv.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY; });
const ptrUp = e => { touches.delete(e.pointerId); if (touches.size === 0) pointer.active = false; };
addEventListener('pointerup', ptrUp); addEventListener('pointercancel', ptrUp);

function onKey(c) {
  initAudio();
  if (c === 'KeyM') { muted = !muted; return; }
  if (state === 'title') { if (c === 'Enter' || c === 'Space') startGame(); return; }
  if (state === 'over') { if ((c === 'Enter' || c === 'KeyR' || c === 'Space') && overT > 1.5) startGame(); return; }
  if (c === 'KeyP' || c === 'Escape') { paused = !paused; return; }
  if (paused) return;
  if (c === 'ShiftLeft' || c === 'ShiftRight' || c === 'Space' || c === 'KeyK') startRoll();
  if (c === 'KeyB' || c === 'KeyX' || c === 'KeyL') useBomb();
}

// ---------- game state ----------
const ROLL_DUR = 0.5;
let P = null, bullets = [], ebullets = [], enemies = [], parts = [], texts = [], pickups = [], beams = [], ghosts = [], speedLines = [];
let farClouds = [], nearClouds = [], slAcc = 0;
let state = 'title', score = 0, dispScore = 0, scorePulse = 0, best = 0, prevBest = 0, combo = 0, comboT = 0, comboPulse = 0, maxCombo = 0, kills = 0, grazes = 0;
let wave = 0, waveQueue = [], waveClock = 0, waveDoneT = 0, banner = null, stageIdx = 0, prevStage = 0, stageMix = 1;
let shake = 0, hitstop = 0, timeScale = 1, slowT = 0, flash = 0, flashCol = C.white, dmgVig = 0;
let scrollSpeed = 260, scrollTarget = 260, scrollY = 0, gT = 0, overT = 0, paused = false, bomb = null, bossBarK = 0, bossHpLag = 1, shootSnd = 0, hitSnd = 0;
try { best = +localStorage.getItem('skystriker_best') || 0; } catch (e) { }

const PALS = [
  { top: '#03081c', bot: '#14285a', tint: 'rgba(40,90,220,0.16)', name: 'NIGHT CITY' },
  { top: '#16030f', bot: '#5a1636', tint: 'rgba(255,70,120,0.14)', name: 'CRIMSON DUSK' },
  { top: '#01120d', bot: '#0b4a3a', tint: 'rgba(40,255,180,0.10)', name: 'TOXIC BAY' },
  { top: '#0e0320', bot: '#38125e', tint: 'rgba(170,90,255,0.16)', name: 'VOID NEBULA' },
];
const WAVE_SUBS = ['적 편대 접근 중', '요격을 개시하라', '하늘을 사수하라', '전 기체 격추하라', '적 증원군 감지'];

function makePlayer() {
  return { x: W / 2, y: H + 100, vx: 0, vy: 0, bank: 0, hp: 100, hpLag: 100, power: 1, bombs: 3, inv: 0, fireT: 0, missileT: 0,
    roll: 0, rollCd: 0, rollDir: 0, alive: true, spawnT: 1.3, muzzle: 0, trailL: [], trailR: [], ghostT: 0 };
}
function newCloud(far, init) {
  const s = far ? rand(180, 340) : rand(450, 800);
  return { x: rand(0, W), y: init ? rand(-s / 2, H) : -s / 2 - rand(0, 300), s, spr: Math.random() * 4 | 0,
    a: far ? rand(0.07, 0.15) : rand(0.07, 0.13), k: far ? rand(0.5, 0.8) : rand(1.7, 2.3) };
}
function initBG() {
  farClouds = []; nearClouds = [];
  for (let i = 0; i < 7; i++) farClouds.push(newCloud(true, true));
  for (let i = 0; i < 3; i++) nearClouds.push(newCloud(false, true));
}
initBG();
P = makePlayer(); P.y = H * 0.62; P.spawnT = 0;

function startGame() {
  initAudio();
  P = makePlayer();
  bullets = []; ebullets = []; enemies = []; parts = []; texts = []; pickups = []; beams = []; ghosts = [];
  score = 0; dispScore = 0; combo = 0; comboT = 0; maxCombo = 0; kills = 0; grazes = 0;
  wave = 0; waveDoneT = 0; bomb = null; overT = 0; shake = 0; flash = 0.6; flashCol = C.cyan; slowT = 0; timeScale = 1;
  prevBest = best; stageIdx = 0; prevStage = 0; stageMix = 1; paused = false;
  state = 'play';
  nextWave();
}

// ---------- particles ----------
function part(o) { if (parts.length < 2200) { o.max = o.life; parts.push(o); } }
function spark(x, y, a, spd, col, life = rand(0.2, 0.5), size = rand(1, 2.6)) {
  part({ type: 'spark', x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, life, size, col, drag: 3.5 });
}
function ring(x, y, r0, r1, life, col, w = 6) { part({ type: 'ring', x, y, vx: 0, vy: 0, r0, r1, life, col, w, drag: 0 }); }
function explode(x, y, s = 1, col = C.orange) {
  const n = Math.round(14 * s);
  for (let i = 0; i < n; i++) spark(x, y, rand(0, TAU), rand(150, 650) * Math.sqrt(s), Math.random() < 0.5 ? C.yellow : col, rand(0.25, 0.7));
  for (let i = 0; i < 9 * s; i++) {
    const a = rand(0, TAU), v = rand(20, 220) * s;
    part({ type: 'glow', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.3, 0.8),
      size: rand(12, 30) * Math.sqrt(s), col: [C.yellow, C.orange, col, C.white][Math.random() * 4 | 0], drag: 3 });
  }
  for (let i = 0; i < 6 * s; i++) {
    const a = rand(0, TAU), v = rand(20, 130) * Math.sqrt(s);
    part({ type: 'smoke', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.8, 1.7), size: rand(14, 30) * Math.sqrt(s), grow: 2.2, drag: 2 });
  }
  for (let i = 0; i < 5 * s; i++) {
    const a = rand(0, TAU), v = rand(120, 420) * Math.sqrt(s);
    part({ type: 'debris', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.5, 1.2), size: rand(3, 8), rot: rand(0, TAU), vr: rand(-15, 15), drag: 2.2 });
  }
  ring(x, y, 6, 80 * s, 0.45, C.white, 5 * Math.sqrt(s));
  ring(x, y, 4, 50 * s, 0.6, col, 3);
  part({ type: 'flare', x, y, vx: 0, vy: 0, life: 0.18, size: 110 * s, col: C.white, drag: 0 });
  shake = Math.min(40, shake + 4 * s);
}

// ---------- weapons ----------
function firePlayer() {
  const pw = P.power, x = P.x, y = P.y - 28;
  const add = (ox, ang, dmg = 1, w = 3) => bullets.push({ x: x + ox, y: y + Math.abs(ox) * 0.4, vx: Math.sin(ang) * 1400, vy: -Math.cos(ang) * 1400, dmg, w, m: false });
  add(-7, 0); add(7, 0);
  if (pw >= 2) { add(-17, -0.07); add(17, 0.07); }
  if (pw >= 4) { add(-24, -0.2); add(24, 0.2); }
  if (pw >= 5) add(0, 0, 2, 6);
  P.muzzle = 1;
  if ((shootSnd++ & 1) === 0) sfx('shoot');
}
function fireMissiles() {
  for (const s of [-1, 1]) bullets.push({ x: P.x + s * 22, y: P.y + 6, vx: s * 280, vy: 80, m: true, dmg: 4, t: 0, tgt: null });
  sfx('missile');
}
function eb(x, y, a, spd, o = {}) {
  ebullets.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: o.r || 6, col: o.col || C.pink, t: 0, grazed: false });
}
function aimed(e, spd, n = 1, spread = 0.15, col = C.pink) {
  const a = Math.atan2(P.y - e.y, P.x - e.x);
  for (let i = 0; i < n; i++) eb(e.x, e.y, a + (i - (n - 1) / 2) * spread, spd, { col });
  part({ type: 'flare', x: e.x, y: e.y, vx: 0, vy: 0, life: 0.1, size: 26, col, drag: 0 });
}

function startRoll() {
  if (state !== 'play' || !P.alive || P.spawnT > 0 || P.rollCd > 0) return;
  let dir = 0;
  if (keys.ArrowLeft || keys.KeyA) dir = -1; else if (keys.ArrowRight || keys.KeyD) dir = 1;
  else if (Math.abs(P.vx) > 60) dir = Math.sign(P.vx);
  P.roll = ROLL_DUR; P.rollCd = 0.85; P.rollDir = dir;
  sfx('roll');
  ring(P.x, P.y, 20, 90, 0.35, C.cyan, 3);
  for (let i = 0; i < 25; i++) speedLines.push({ x: rand(0, W), y: rand(-H, 0), len: rand(80, 200), spd: rand(2000, 3200), a: rand(0.15, 0.35) });
}
function useBomb() {
  if (state !== 'play' || !P.alive || P.bombs <= 0 || bomb || P.spawnT > 0) return;
  P.bombs--; bomb = { x: P.x, y: P.y, r: 0, t: 0, hit: new Set() };
  flash = 0.9; flashCol = C.yellow; shake = Math.min(45, shake + 25); P.inv = Math.max(P.inv, 2.5); hitstop = 0.07;
  sfx('bigboom');
  floatText(P.x, P.y - 60, 'BOMB!', C.yellow, 44, 1.0);
}

// ---------- enemies ----------
const DEF = {
  fighter: { hp: 3, r: 18, score: 100 },
  kami: { hp: 2, r: 14, score: 150 },
  gunship: { hp: 60, r: 44, score: 1500 },
  drone: { hp: 30, r: 26, score: 800 },
};
const diffHP = () => 1 + (wave - 1) * 0.09;
const diffR = () => Math.min(2.1, 1 + (wave - 1) * 0.07);

function spawnEnemy(type, o) {
  const d = DEF[type];
  const e = Object.assign({ type, t: 0, hp: d.hp * diffHP(), r: d.r, score: d.score, flash: 0, shootT: rand(0.6, 1.8), x: 0, y: -40, ang: Math.PI / 2, spin: 0 }, o);
  if (o.x0 !== undefined) { e.x = o.x0; e.y = o.y0; }
  e.maxhp = e.hp; enemies.push(e); return e;
}
function spawnBoss(n) {
  const level = n / 5;
  const hp = 1800 * (1 + (level - 1) * 0.6);
  enemies.push({ type: 'boss', x: W / 2, y: -220, ty: Math.max(130, H * 0.2), hp, maxhp: hp, r: 90, score: 30000 * level, t: 0, enter: 0,
    phase: 0, patI: 0, pat: '', patT: 0, patDur: 0, shotT: 0, ang: 0, wander: 0, level, inv: true, flash: 0, dying: false, dieT: 0 });
  bossHpLag = 1;
  scrollTarget = 260;
}

function buildWave(n) {
  const q = [];
  if (n % 5 === 0) { q.push({ at: 3.4, fn: () => spawnBoss(n) }); return q; }
  const pool = ['vee', 'snake', 'sweep'];
  if (n >= 2) pool.push('kami', 'kami', 'gunship');
  if (n >= 3) pool.push('drones');
  let t = 2.2, heavy = 0;
  const count = 4 + Math.min(8, n);
  for (let i = 0; i < count; i++) {
    let f = pool[Math.random() * pool.length | 0];
    const isHeavy = f === 'gunship' || f === 'drones';
    if (isHeavy && heavy >= 1 + Math.floor(n / 4)) f = 'vee'; else if (isHeavy) heavy++;
    formation(q, f, t);
    t += rand(1.8, 2.8) * Math.max(0.55, 1 - (n - 1) * 0.05) + (isHeavy ? 2 : 0);
  }
  return q;
}
function formation(q, f, t) {
  switch (f) {
    case 'vee': {
      const cx = rand(W * 0.2, W * 0.8);

  if (p.trailL.length > 24) { p.trailL.pop(); p.trailR.pop(); }

    const life = rand(0.12, 0.26);
    part({ type: 'glow', x: p.x + s * 5 * sx + rand(-2, 2), y: p.y + 36, vx: rand(-20, 20), vy: rand(280, 420), life, size: rand(6, 10), col: Math.random() < 0.6 ? C.cyan : C.white, drag: 2 });

function update(dt, rdt) {

          for (const e of enemies) { if (e.dead || e.dying || e.inv || e.y < -20) continue; const d = (e.x - b.x) ** 2 + (e.y - b.y) ** 2; if (d < bd) { bd = d; b.tgt = e; } }

    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -40 || b.y > H + 40 || b.x < -40 || b.x > W + 40) b.dead = true;

  for (const e of enemies) {
    if (e.dead || e.dying) continue;
    for (const b of bullets) {
      if (b.dead) continue;
      const dx = b.x - e.x, dy = b.y - e.y;
      const hit = e.type === 'boss' ? ((Math.abs(dx) < 150 && dy > -40 && dy < 30) || dx * dx + dy * dy < 75 * 75) : dx * dx + dy * dy < (e.r + 6) ** 2;

          if (b.m) { explode(b.x, b.y, 0.35, C.orange); }
          else { for (let i = 0; i < 2; i++) spark(b.x, b.y, -Math.PI / 2 + Math.PI + rand(-1.2, 1.2), rand(100, 350), C.cyan, 0.2); part({ type: 'glow', x: b.x, y: b.y, vx: 0, vy: 0, life: 0.08, size: 14, col: C.white, drag: 0 }); }

      const d2 = (b.x - P.x) ** 2 + (b.y - P.y) ** 2;

  }

  // beams

}

  if (state === 'play' || state === 'over') {
    if (P.alive && P.hp < 30) { const a = 0.25 + Math.sin(gT * 6) * 0.15; const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.hypot(W, H) * 0.6); g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,0,40,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
    if (dmgVig > 0) { const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.hypot(W, H) * 0.6); g.addColorStop(0, 'rgba(255,0,40,0)'); g.addColorStop(1, `rgba(255,20,60,${dmgVig * 0.7})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  }
  if (flash > 0) { ctx.fillStyle = `rgba(${flashCol},${Math.min(0.85, flash * 0.6)})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || (state === 'over' && overT < 1)) { drawHUD(rdt); drawBanner(rdt); }
  if (state === 'title') drawTitle();
  if (state === 'over') drawGameOver();
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,15,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `900 56px ${FONT}`; ctx.fillStyle = '#fff'; ctx.fillText('PAUSED', W / 2, H / 2 - 10);
    ctx.font = `400 18px ${KFONT}`; ctx.fillStyle = 'rgb(180,230,255)'; ctx.fillText('P 또는 클릭으로 계속', W / 2, H / 2 + 36);
  }
  if (muted) { ctx.textAlign = 'center'; ctx.font = `600 11px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillText('MUTED', W / 2, H - 14); }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let rdt = Math.min(0.033, (now - last) / 1000); last = now;
  if (paused) { render(0); requestAnimationFrame(frame); return; }
  let dt = rdt;
  if (hitstop > 0) { hitstop -= rdt; dt = 0; }
  if (slowT > 0) { slowT -= rdt; timeScale = lerp(timeScale, 0.3, 0.2); } else timeScale = lerp(timeScale, 1, 0.06);
  update(dt * timeScale, rdt);
  render(rdt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
